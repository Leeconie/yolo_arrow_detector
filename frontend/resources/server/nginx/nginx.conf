# 服务器Nginx配置示例
# 适用于直接在Ubuntu服务器上安装Nginx的场景
# 注意：此配置需要根据实际服务器环境进行调整

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 基本配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # Brotli压缩配置
    # 需要安装nginx-module-brotli
    # Ubuntu安装方法：
    #   sudo apt-get install nginx-module-brotli
    #   在/etc/nginx/nginx.conf中添加: load_module modules/ngx_http_brotli_filter_module.so;
    #   在/etc/nginx/nginx.conf中添加: load_module modules/ngx_http_brotli_static_module.so;
    #
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/json
    #     application/javascript
    #     application/xml+rss
    #     application/rss+xml
    #     application/atom+xml
    #     image/svg+xml;
    # brotli_min_length 1000;

    # 包含站点配置
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
