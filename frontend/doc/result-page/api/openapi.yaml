openapi: 3.0.3
info:
  title: 结果展示页面模块 API 文档
  description: |
    结果展示页面模块提供分析结果导出等功能。
    
    ## 认证方式
    
    所有API请求都需要在请求头中携带Bearer Token：
    
    ```
    Authorization: Bearer <token>
    ```
  version: 1.0.0
  contact:
    name: 开发团队
    email: dev@example.com

servers:
  - url: /api
    description: API基础路径

tags:
  - name: 结果导出
    description: 分析结果导出相关接口

paths:
  /analysis/export:
    get:
      tags:
        - 结果导出
      summary: 导出分析结果
      description: |
        根据视频ID导出分析结果，支持多种格式（JSON、CSV、Excel等）。
        
        ## 使用示例
        
        ```typescript
        import { get } from '@/core/api'
        
        // 导出为JSON
        const result = await get('/analysis/export', {
          videoId: 'video_123456',
          format: 'json'
        })
        
        // 导出为CSV
        const csvResult = await get('/analysis/export', {
          videoId: 'video_123456',
          format: 'csv'
        })
        ```
      operationId: exportAnalysisResult
      parameters:
        - name: videoId
          in: query
          required: true
          description: 视频ID
          schema:
            type: string
            example: "video_123456"
        - name: format
          in: query
          required: false
          description: 导出格式
          schema:
            type: string
            enum:
              - json
              - csv
              - excel
            default: json
            example: "json"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 导出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
            application/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 视频或分析结果不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer Token认证
  
  schemas:
    ExportResponse:
      type: object
      description: 导出响应
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "导出成功"
        data:
          oneOf:
            - type: object
              description: JSON格式数据
            - type: string
              description: CSV格式数据
            - type: string
              format: binary
              description: Excel格式数据
        downloadUrl:
          type: string
          description: 下载URL（如果支持）
          example: "https://example.com/downloads/export_123456.json"
        fileName:
          type: string
          description: 文件名
          example: "analysis_result_20260107.json"
    
    ApiError:
      type: object
      description: API错误响应
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 错误码
          example: 400
        message:
          type: string
          description: 错误消息
          example: Bad Request
  
  responses:
    Unauthorized:
      description: 未授权，Token无效或已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 401
            message: 登录已过期，请重新登录
    
    ServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            message: 服务器内部错误
