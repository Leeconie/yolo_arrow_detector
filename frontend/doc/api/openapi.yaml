        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: 请求参数错误
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /video/saveType:
    post:
      tags:
