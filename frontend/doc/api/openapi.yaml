          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/SaveVideoTypeResponse'
              example:
                code: 200
                message: 保存成功
                data:
                  success: true
                timestamp: 1704067200
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: 请求参数错误
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token认证

  schemas:
    # ==================== 通用响应模型 ====================
    ApiResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: 业务状态码，200表示成功
          example: 200
        message:
          type: string
          description: 响应消息
          example: Success
        data:
          description: 响应数据
        timestamp:
          type: integer
          description: 时间戳（可选）
          example: 1704067200

    # ==================== 错误响应模型 ====================
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 错误码
          example: 400
        message:
          type: string
          description: 错误消息
          example: 请求参数错误
        data:
          type: object
          nullable: true
          description: 错误详情（可选）

    # ==================== 用户管理相关模型 ====================
    UserInfo:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: integer
          description: 用户ID
          example: 1
        username:
          type: string
          description: 用户名
          example: zhangsan
        nickname:
          type: string
          description: 昵称
          example: 张三
        email:
          type: string
          format: email
          description: 邮箱
          example: zhangsan@example.com
        phone:
          type: string
          description: 手机号
          pattern: '^1[3-9]\d{9}$'
          example: 13800138000
        avatar:
          type: string
          format: uri
          description: 头像URL
          example: https://example.com/avatar.jpg
        roles:
          type: array
          items:
            type: string
            enum: [admin, user, guest]
          description: 用户角色列表
          example: [user]
        gender:
          type: string
          description: 性别
          enum: [男, 女, 保密]
          example: 男
        userAge:
          type: integer
          description: 用户年龄
          minimum: 1
          maximum: 150
          example: 25
        createdAt:
          type: string
          format: date-time
          description: 创建时间
          example: 2024-01-01T00:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
          example: 2024-01-01T00:00:00Z

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 用户名或邮箱
          example: zhangsan
        password:
          type: string
          description: 密码
          format: password
          example: password123
        captcha:
          type: string
          description: 验证码（可选）
          example: 1234

    LoginResponse:
      type: object
      required:
        - accessToken
        - userInfo
      properties:
        accessToken:
          type: string
          description: 访问令牌
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: 刷新令牌（可选）
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          description: 令牌过期时间（秒）
          example: 3600
        userInfo:
          $ref: '#/components/schemas/UserInfo'

    RegisterRequest:
      type: object
      required:
        - nickname
        - username
        - password
      properties:
        nickname:
          type: string
          description: 昵称
          minLength: 2
          maxLength: 10
          example: 张三
        username:
          type: string
          description: 用户名
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-Z0-9_]+$'
          example: zhangsan
        password:
          type: string
          description: 密码（至少6位）
          format: password
          minLength: 6
          example: password123
        email:
          type: string
          format: email
          description: 邮箱（可选）
          example: zhangsan@example.com
        phone:
          type: string
          description: 手机号（可选）
          pattern: '^1[3-9]\d{9}$'
          example: 13800138000

    RegisterResponse:
      type: object
      required:
        - accessToken
        - userInfo
      properties:
        accessToken:
          type: string
          description: 访问令牌
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: 刷新令牌（可选）
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          description: 令牌过期时间（秒）
          example: 3600
        userInfo:
          $ref: '#/components/schemas/UserInfo'

    # ==================== 射箭分析相关模型 ====================
    ArcheryStats:
      type: object
      required:
        - stability
        - deviation
        - analysisCount
      properties:
        stability:
          type: number
          description: 平均撒放稳定性（分，0-100）
          minimum: 0
          maximum: 100
          example: 85
        deviation:
          type: number
          description: 箭道偏差值（cm）
          minimum: 0
          example: 2.5
        analysisCount:
          type: integer
          description: 有效分析次数
          minimum: 0
          example: 10
        stabilityScore:
          type: number
          description: 稳定性评分（兼容字段，0-100）
          minimum: 0
          maximum: 100
          example: 85
        averageDeviation:
          type: number
          description: 平均偏差值（兼容字段，cm）
          minimum: 0
          example: 2.5
        lastAnalysisTime:
          type: string
          format: date-time
          description: 最近分析时间（兼容字段）
          example: 2024-01-01T12:00:00Z

    HitPoint:
      type: object
      required:
        - x
        - y
        - ring
        - timestamp
      properties:
        x:
          type: number
          description: X坐标
          example: 10.5
        y:
          type: number
          description: Y坐标
          example: 12.3
        ring:
          type: integer
          description: 环数（1-10）
          minimum: 1
          maximum: 10
          example: 8
        timestamp:
          type: integer
          description: 时间戳（毫秒）
          example: 1704067200000

    TrajectoryPoint:
      type: object
      required:
        - x
        - y
        - time
      properties:
        x:
          type: number
          description: X坐标
          example: 0
        y:
          type: number
          description: Y坐标
          example: 0
        time:
          type: number
          description: 时间（秒）
          minimum: 0
          example: 0

    ArcheryDetail:
      type: object
      required:
        - taskId
        - hitPoints
        - trajectory
      properties:
        taskId:
          type: string
          description: 任务ID
          example: task-1234567890
        hitPoints:
          type: array
          items:
            $ref: '#/components/schemas/HitPoint'
          description: 命中点列表
        trajectory:
          type: array
          items:
            $ref: '#/components/schemas/TrajectoryPoint'
          description: 撒放轨迹

    UploadArcheryVideoResponse:
      type: object
      required:
        - taskId
      properties:
        taskId:
          type: string
          description: 分析任务ID
          example: task-1234567890

    # ==================== 视频上传相关模型 ====================
    ChunkUploadResponse:
      type: object
      required:
        - chunkIndex
        - uploaded
        - videoId
      properties:
        chunkIndex:
          type: integer
          description: 已上传的分片索引
          example: 0
        uploaded:
          type: boolean
          description: 是否上传成功
          example: true
        videoId:
          type: string
          description: 视频ID
          example: 'video_123456'

    ValidateVideoRequest:
      type: object
      required:
        - fileName
        - fileSize
        - fileType
      properties:
        fileName:
          type: string
          description: 文件名
          example: 'video.mp4'
        fileSize:
          type: integer
          description: 文件大小（字节）
          example: 104857600
        fileType:
          type: string
          description: 文件MIME类型
          example: 'video/mp4'

    ValidateVideoResponse:
      type: object
      required:
        - valid
        - message
      properties:
        valid:
          type: boolean
          description: 是否校验通过
          example: true
        message:
          type: string
          description: 校验消息
          example: '文件格式正确'

    SaveVideoTypeRequest:
      type: object
      required:
        - videoId
        - videoType
      properties:
        videoId:
          type: string
          description: 视频ID
          example: 'video_123456'
        videoType:
          type: string
          enum:
            - human
            - archery
          description: 视频类型，human表示运动人体视频，archery表示射箭视频
          example: 'human'

    SaveVideoTypeResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 是否保存成功
          example: true

  responses:
    # ==================== 标准错误响应模型 ====================
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 400
            message: 请求参数错误
            data: null

    Unauthorized:
      description: 未授权，需要登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 401
            message: 未授权，请先登录
            data: null

    Forbidden:
      description: 无权限访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 403
            message: 无权限访问
            data: null

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 404
            message: 资源不存在
            data: null

    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 500
            message: 服务器内部错误
            data: null
